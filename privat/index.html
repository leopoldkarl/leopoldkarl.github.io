<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Privat</title>

  <!-- Nicht verlinkt, nicht indexiert, kein Analytics. Der Inhalt liegt nur
       als AES-256-GCM-Chiffrat in inhalt.enc.json; ohne Passphrase liefert
       diese Seite nichts ausser dem Formular. -->
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="light dark" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="./privat.css" />
</head>
<body>
<main>
  <section id="sperre" class="sperre" hidden>
    <h1 class="page-title">Privat</h1>
    <form id="form" class="card" autocomplete="on">
      <!-- verstecktes Benutzerfeld, damit Passwortmanager die Seite zuordnen -->
      <input type="text" name="username" value="leopoldkarl.com/privat" autocomplete="username" hidden />
      <label for="pw">Passphrase</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus />
      <label class="merken"><input id="merken" type="checkbox" /> Auf diesem Gerät merken</label>
      <button class="btn primary" type="submit" id="go">Entsperren</button>
      <p id="meldung" class="meldung" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section id="inhalt" hidden></section>
  <p id="sperren-wrap" class="sperren" hidden><button id="sperren" class="btn" type="button">Sperren</button></p>
</main>
<script type="module" src="./privat.js"></script>
</body>
</html>
